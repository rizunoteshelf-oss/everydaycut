<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="alternate icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    
    <!-- PWA Primary Colors & App Settings -->
    <meta name="theme-color" content="#22c55e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="EverydayCut" />

    <title>EverydayCut - 100% Free Client-Side AI Creative Studio & Background Remover</title>
    <meta name="description" content="Free, 100% private, on-device AI background remover, magic eraser, and photo editor. No cloud uploads, no subscriptions, unlimited HD exports." />
    
    <!-- Legacy Hash-Fragment to Clean Path Pre-Hydration Redirect -->
    <script>
      (function() {
        try {
          var hash = window.location.hash;
          if (hash && hash.indexOf('#/') === 0) {
            var cleanPath = hash.substring(1);
            if (cleanPath.length > 1) {
              window.history.replaceState(null, '', cleanPath);
            }
          }
        } catch (e) {}
      })();
    </script>

    <!-- Google Consent Mode v2 Default (EEA/UK/CH Denied Until Consent) -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('consent', 'default', {
        ad_storage: 'denied',
        analytics_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        region: ['AT','BE','BG','CH','CY','CZ','DE','DK','EE','ES','FI','FR','GB','GR','HR','HU','IE','IS','IT','LI','LT','LU','LV','MT','NL','NO','PL','PT','RO','SE','SI','SK']
      });
      try {
        var savedConsent = localStorage.getItem('everydaycut_cookie_consent');
        if (savedConsent === 'accepted') {
          gtag('consent', 'update', {
            ad_storage: 'granted',
            analytics_storage: 'granted',
            ad_user_data: 'granted',
            ad_personalization: 'granted'
          });
        }
      } catch (e) {}
    </script>

    <!-- Google AdSense (Verified Publisher ID ca-pub-5975753455053538) -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5975753455053538" crossorigin="anonymous"></script>
    
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('everydaycut_theme');
          var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.classList.add(theme);
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-stage text-zinc-900 dark:text-zinc-100 antialiased overflow-hidden select-none transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').catch(function(err) {
            console.warn('[PWA] Service Worker registration failed:', err);
          });
        });
      }
    </script>

</html>
